<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#14161f">
<script type="module" src="firebase-sync.js"></script>
<script>
(function(){
  try{
    var prefs = JSON.parse(localStorage.getItem('pl-prefs')||'{}');
    var theme = ['dark','light','blue','auto'].includes(prefs.theme) ? prefs.theme : 'blue';
    var eff = theme;
    if(theme==='auto'){
      eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'blue');
  }
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="pl-app"></div>
<script src="app.js"></script>
</body>
</html>
